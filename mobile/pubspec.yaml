name: hally
description: Hally – AI-first family assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  # Pinned: the share extension links its Swift package by its versioned folder (ios/Runner.xcodeproj, receive_sharing_intent-<version>).
  receive_sharing_intent: 1.9.0
  share_plus: ^13.3.1
  sentry_flutter: ^10.3.0
  signalr_netcore: ^1.4.4
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  home_widget: ^0.10.0
  flutter_local_notifications: ^23.0.4
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
