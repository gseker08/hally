name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - name: Check migrations are up to date
        run: |
          dotnet tool install -g dotnet-ef --version 8.0.11
          dotnet ef migrations has-pending-model-changes -p backend/src/Hally.Infrastructure -s backend/src/Hally.Infrastructure
      # Integration tests start PostgreSQL through Testcontainers (Docker is available on the runner).
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Build API image
        run: docker build -f backend/Dockerfile -t hally-api:ci .

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Flutter 3.50 reports material.dart deprecation infos (material_ui split); errors and warnings still fail CI.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Builds a debug APK so Gradle, plugin and Kotlin/Java problems show up before they reach a phone.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # A placeholder Firebase config, so the build also covers the google-services plugin path.
      - name: Placeholder google-services.json
        run: |
          cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"1","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:1:android:0000000000000000","android_client_info":{"package_name":"app.hally"}},
                      "oauth_client":[],"api_key":[{"current_key":"placeholder"}],
                      "services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
           "configuration_version":"1"}
          JSON
      - run: flutter build apk --debug

  # Builds the iPhone app (with its widget and share extensions) without signing, so Xcode, CocoaPods/Swift package
  # and Swift problems show up here too. Signing and TestFlight need an Apple Developer account: see docs/mobile/ios.md.
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
