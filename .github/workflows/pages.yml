# Publishes site/ (privacy policy, KVKK text, account deletion page) to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the placeholders are filled in
        id: check
        run: |
          if grep -rn 'class="todo"' site/*.html; then
            echo "::warning::site/ still has [PLACEHOLDER] values (listed above), so nothing is published. See site/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.check.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
